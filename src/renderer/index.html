<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Netizen Text Editor</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="identity">
          <span class="brand">NETIZEN TEXT</span>
          <span id="document-name" class="document-name">Untitled</span>
          <span
            id="dirty-indicator"
            class="dirty-indicator"
            aria-label="Unsaved changes"
            hidden
          ></span>
        </div>
        <div class="toolbar" aria-label="Document commands">
          <button
            class="icon-button"
            type="button"
            data-command="open"
            aria-label="Open file"
            title="Open file"
          >
            <i data-lucide="folder-open" aria-hidden="true"></i>
          </button>
          <button
            class="icon-button"
            type="button"
            data-command="save"
            aria-label="Save file"
            title="Save file"
          >
            <i data-lucide="save" aria-hidden="true"></i>
          </button>
          <button
            class="icon-button"
            type="button"
            data-command="save-as"
            aria-label="Save file as"
            title="Save file as"
          >
            <i data-lucide="files" aria-hidden="true"></i>
          </button>
          <span class="toolbar-divider" aria-hidden="true"></span>
          <button
            class="icon-button"
            type="button"
            data-command="find"
            aria-label="Find"
            title="Find"
          >
            <i data-lucide="search" aria-hidden="true"></i>
          </button>
          <button
            class="icon-button"
            type="button"
            data-command="replace"
            aria-label="Find and replace"
            title="Find and replace"
          >
            <i data-lucide="replace" aria-hidden="true"></i>
          </button>
          <span class="toolbar-divider" aria-hidden="true"></span>
          <button
            class="icon-button"
            type="button"
            data-command="close"
            aria-label="Close file"
            title="Close file"
          >
            <i data-lucide="x" aria-hidden="true"></i>
          </button>
        </div>
      </header>
      <section id="editor" class="editor-host" aria-label="Text editor"></section>
      <footer class="statusbar"><span id="status-message">Ready</span><span>UTF-8</span></footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
